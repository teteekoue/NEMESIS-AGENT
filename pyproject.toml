[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis-cli"
version = "2.1.0"
description = "Autonomous coding and system engineering agent CLI with Web UI, memory and GitHub integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TEJF - L'Aigle de la Justice"}
]
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "prompt_toolkit>=3.0.0",
    "jinja2>=3.0.0",
    "ddgs>=9.0.0",
    "markdownify>=0.11.0",
    "python-telegram-bot>=20.0"
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
nemesis = "agent:main"
nemesis-cli = "cli:main"
nemesis-bot = "telegram_bot:main"
nemesis-web = "web.backend.__main__:main"

[tool.setuptools]
py-modules = [
    "agent",
    "cli",
    "telegram_bot",
    "action_parser",
    "tools",
    "tools_schema",
    "uploader",
    "mcp_calculator",
    "bridge_client"
]
packages = [
    "src",
    "src.ui",
    "src.core",
    "src.core.tools",
    "providers",
    "web",
    "web.backend"
]

[tool.setuptools.package-data]
"src.ui" = ["VIBE_UI_LICENSE.txt"]

[tool.setuptools.data-files]
"." = [
    "prompt_system.txt",
    "prompt_system_telegram.txt",
    "config.yaml",
    "mcp_config.yaml",
    "agents.json"
]
"tools_library/unit-converter" = [
    "tools_library/unit-converter/SKILL.md"
]
"tools_library/brainstorming" = [
    "tools_library/brainstorming/SKILL.md"
]
"tools_library/frontend-design" = [
    "tools_library/frontend-design/SKILL.md"
]
"tools_library/git-workflow" = [
    "tools_library/git-workflow/SKILL.md"
]
"tools_library/systematic-debugging" = [
    "tools_library/systematic-debugging/SKILL.md"
]
"tools_library/verification-before-completion" = [
    "tools_library/verification-before-completion/SKILL.md"
]
