[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nemesis-cli"
version = "2.2.2"
description = "Autonomous coding and system engineering agent CLI with Telegram bot, memory and GitHub integration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TEJF - L'Aigle de la Justice"}
]
dependencies = [
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "prompt_toolkit>=3.0.0",
    "jinja2>=3.0.0",
    "ddgs>=9.0.0",
    "markdownify>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-telegram-bot>=20.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
nemesis = "cli:main"
nemesis-cli = "cli:main"
nemesis-bot = "telegram_bot:main"

[tool.setuptools]
py-modules = [
    "agent",
    "cli",
    "telegram_bot",
    "action_parser",
    "tools",
    "tools_schema",
    "uploader",
    "mcp_calculator",
    "bridge_client"
]
packages = [
    "src",
    "src.ui",
    "src.core",
    "src.core.tools",
    "providers",
]

[tool.setuptools.package-data]
"src.ui" = ["VIBE_UI_LICENSE.txt"]

[tool.setuptools.data-files]
"." = ["prompt_system.txt", "prompt_system_telegram.txt", "config.yaml", "mcp_config.yaml", "agents.json"]
"tools_library" = [
    "tools_library/ATTRIBUTION.md"
]
"tools_library/brainstorming" = [
    "tools_library/brainstorming/SKILL.md",
    "tools_library/brainstorming/builder-check-prompt.md",
    "tools_library/brainstorming/visual-companion.md"
]
"tools_library/brainstorming/scripts" = [
    "tools_library/brainstorming/scripts/frame-template.html",
    "tools_library/brainstorming/scripts/helper.js",
    "tools_library/brainstorming/scripts/server.cjs",
    "tools_library/brainstorming/scripts/start-server.sh",
    "tools_library/brainstorming/scripts/stop-server.sh"
]
"tools_library/cybersecurity-audit" = [
    "tools_library/cybersecurity-audit/SKILL.md"
]
"tools_library/frontend-design" = [
    "tools_library/frontend-design/LICENSE.txt",
    "tools_library/frontend-design/SKILL.md"
]
"tools_library/git-workflow" = [
    "tools_library/git-workflow/SKILL.md"
]
"tools_library/systematic-debugging" = [
    "tools_library/systematic-debugging/CREATION-LOG.md",
    "tools_library/systematic-debugging/SKILL.md",
    "tools_library/systematic-debugging/condition-based-waiting-example.ts",
    "tools_library/systematic-debugging/condition-based-waiting.md",
    "tools_library/systematic-debugging/defense-in-depth.md",
    "tools_library/systematic-debugging/find-polluter.sh",
    "tools_library/systematic-debugging/root-cause-tracing.md",
    "tools_library/systematic-debugging/test-academic.md",
    "tools_library/systematic-debugging/test-pressure-1.md",
    "tools_library/systematic-debugging/test-pressure-2.md",
    "tools_library/systematic-debugging/test-pressure-3.md"
]
"tools_library/unit-converter" = [
    "tools_library/unit-converter/SKILL.md"
]
"tools_library/verification-before-completion" = [
    "tools_library/verification-before-completion/SKILL.md"
]
