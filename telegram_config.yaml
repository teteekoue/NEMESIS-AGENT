# Configuration pour le bot Telegram NEMESIS
# Copiez ce fichier en telegram_config.yaml et remplissez avec vos informations

# Token du bot Telegram (obtenu via @BotFather)
# Set TELEGRAM_BOT_TOKEN in the environment. Never commit a real token.
token: ""

# Répertoire de départ pour l'agent (vide = répertoire courant).
# L'agent n'est pas confiné : il peut agir partout sur le système.
workspace: ""

# Configuration optionnelle
# timeout: 30  # Timeout en secondes pour les requêtes
# max_message_length: 4000  # Longueur maximale des messages (limite Telegram)

# Autorisations (optionnel)
# allowed_users:  # Liste des IDs utilisateurs autorisés (laisser vide pour tous)
#   - 123456789
#   - 987654321

# Paramètres NEMAPI (optionnel)
provider:
  type: "nemapi"
nemapi:
  host: "127.0.0.1"
  port: 8080
  model: ""
